name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run repository checks
        run: npm run check

      # The host from 2026.9.3 on needs Node 24.16+; on the Node above npm skips
      # it silently and the typecheck finds no SDK. The checks before this step
      # stay on the oldest supported Node.
      - name: Setup Node.js for the host SDK
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm

      # Typechecking needs the host SDK, which is an optional peer and therefore
      # absent from `npm ci`. Installed without touching the lockfile, the same
      # way the runtime job does it; `--save-dev`, because npm 11 prunes a
      # `--no-save` package.
      - name: Typecheck against the host SDK
        run: |
          npm install --save-dev --package-lock=false openclaw@latest
          npm run check:types

  runtime-compatibility:
    name: OpenClaw runtime (${{ matrix.openclaw }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - openclaw: "2026.8.1"
            node: "22.22.3"
          - openclaw: latest
            node: "24.16.0"
          - openclaw: beta
            node: "24.16.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install plugin dependencies
        run: npm ci

      - name: Install OpenClaw host
        run: npm install --save-dev --package-lock=false "openclaw@${{ matrix.openclaw }}"

      - name: Build plugin
        run: npm run build

      - name: Resolve SDK imports and load packaged runtime
        run: npm run check:runtime
